<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>2048</h1>
            <div class="score-container">
                <div class="score-label">Счет</div>
                <div class="score-value" id="score">0</div>
            </div>
        </header>
        
        <div class="game-info">
            <button id="new-game">Новая игра</button>
            <button id="undo">Отменить ход</button>
            <button id="leaderboard">Таблица лидеров</button>
        </div>
        
        <div class="game-container">
            <div class="grid-container" id="grid">
                <!-- Grid cells will be generated by JavaScript -->
            </div>
        </div>
        
        <div class="mobile-controls">
            <button class="up-btn" id="up">↑</button>
            <button class="left-btn" id="left">←</button>
            <button class="right-btn" id="right">→</button>
            <button class="down-btn" id="down">↓</button>
        </div>
        
        <!-- Game Over Modal -->
        <div class="modal" id="game-over-modal">
            <div class="modal-content">
                <h2>Игра окончена!</h2>
                <p>Ваш счет: <span id="final-score">0</span></p>
                <div id="name-input-section">
                    <input type="text" id="player-name" placeholder="Введите ваше имя" maxlength="20">
                    <div class="modal-buttons">
                        <button id="save-score">Сохранить результат</button>
                        <button id="restart">Начать заново</button>
                    </div>
                </div>
                <div id="score-saved-message" style="display: none;">
                    <p>Ваш рекорд сохранен!</p>
                    <button id="close-modal">Закрыть</button>
                </div>
            </div>
        </div>
        
        <!-- Leaderboard Modal -->
        <div class="modal" id="leaderboard-modal">
            <div class="modal-content">
                <h2>Таблица лидеров</h2>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Очки</th>
                            <th>Дата</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Leaderboard entries will be populated by JavaScript -->
                    </tbody>
                </table>
                <button id="close-leaderboard" style="margin-top: 15px;">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
